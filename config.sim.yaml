# CockBook-Konfiguration für den lokalen Simulator (make sim). Schema: backend/cockbook/config.py
# KEINE Secrets hier eintragen – API-Keys nur über Umgebungsvariablen/Keyring.

logging:
  level: INFO        # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: console    # console | json

exchanges:
  - name: binance_usdm
    enabled: true
    symbols:
      - symbol: BTCUSDT
    # Simulator statt Binance
    rest_url: http://127.0.0.1:9876
    ws_public_url: ws://127.0.0.1:9876/public
    ws_market_url: ws://127.0.0.1:9876/market
    depth_update_ms: 100          # 100 | 250 | 500
    snapshot_limit: 1000          # Gewicht 20 von 2400/min
    max_buffered_updates: 10000
    coverage_refresh_fraction: 0.5  # neuer Snapshot, wenn der Mid die innere Hälfte verlässt
    validation:
      enabled: true
      interval_s: 30              # im Simulator häufiger prüfen
      snapshot_limit: 1000
      history_updates: 600        # ~60 s bei 100 ms
      resync_on_mismatch: true
    reconnect:
      initial_backoff_s: 1
      max_backoff_s: 60
      stale_timeout_s: 30         # keine Daten -> Verbindung tot
      stable_after_s: 60

aggregation:
  interval_ms: 100   # Breite einer Heatmap-Spalte
  bucket_ticks: 1    # Preis-Bucket als Vielfaches der Tick-Größe

server:
  host: 127.0.0.1    # nur Loopback erlaubt
  port: 8765

recorder:
  data_dir: data/sim # getrennt von echten Aufzeichnungen (gitignored)
  flush_interval_s: 5
  zstd_level: 9
