# CockBook Konfiguration. Schema: backend/cockbook/config.py
# KEINE Secrets hier eintragen – API-Keys nur über Umgebungsvariablen/Keyring.

logging:
  level: INFO        # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: console    # console | json

exchanges:
  - name: binance_usdm
    enabled: true
    # Reihenfolge = Reihenfolge im Coin-Menü. Top 20 nach Marktkapitalisierung (ohne
    # Stablecoins) + Gold/Silber. Kennzahlen (Preis, 24h, Funding …) gibt es für alle;
    # das Orderbuch (Heatmap) läuft ab Start nur bei always_on, sonst ab der ersten Auswahl.
    # Symbole, die es auf Binance USDⓈ-M nicht gibt, werden mit Warnung übersprungen.
    symbols:
      - {symbol: BTCUSDT, always_on: true}
      - {symbol: ETHUSDT, always_on: true}
      - {symbol: XRPUSDT, always_on: true}
      - symbol: BNBUSDT
      - {symbol: SOLUSDT, always_on: true}
      - symbol: TRXUSDT
      - symbol: DOGEUSDT
      - symbol: ADAUSDT
      - symbol: HYPEUSDT
      - symbol: LINKUSDT
      - symbol: BCHUSDT
      - symbol: XLMUSDT
      - symbol: SUIUSDT
      - symbol: AVAXUSDT
      - symbol: LTCUSDT
      - symbol: HBARUSDT
      - symbol: TONUSDT
      - {symbol: 1000SHIBUSDT, label: "SHIB (x1000)"}   # Futures handeln SHIB nur in 1000er-Einheiten
      - symbol: DOTUSDT
      - symbol: UNIUSDT
      - {symbol: XAUUSDT, label: "Gold (XAU)"}           # TradFi-Perpetual, Handelspausen am Wochenende
      - {symbol: XAGUSDT, label: "Silber (XAG)"}
      # optional fest statt automatisch:  - {symbol: BTCUSDT, bucket_ticks: 5}
    # Endpoints laut Doku (geroutet: /public = Depth, /market = aggTrade/forceOrder)
    rest_url: https://fapi.binance.com
    ws_public_url: wss://fstream.binance.com/public
    ws_market_url: wss://fstream.binance.com/market
    depth_update_ms: 100          # 100 | 250 | 500
    snapshot_limit: 1000          # Gewicht 20 von 2400/min
    max_buffered_updates: 10000
    coverage_refresh_fraction: 0.5  # Refresh, wenn der Mid die innere Hälfte des Snapshots verlässt
    coverage_refresh_min_interval_s: 5  # Refresh wird eingearbeitet, ohne das Buch zu verwerfen
    liquidations_all_market: true   # Liquidationen aller Coins (sekündlich) statt nur der eigenen
    candles_1m_history: 1500        # 1m-Kerzen beim Start (max. 1500 = 25 h)
    tradfi_stale_timeout_s: 900     # Gold/Silber: in Handelspausen kommen minutenlang keine Updates
    validation:
      enabled: true
      interval_s: 300             # Abgleich lokales Buch vs. REST-Snapshot alle 5 min
      snapshot_limit: 1000
      history_updates: 600        # ~60 s bei 100 ms
      resync_on_mismatch: true
    metrics:                      # Derivate-Kennzahlen per REST (ohne API-Key)
      enabled: true
      open_interest_interval_s: 15
      ratios_interval_s: 300      # Long/Short + Taker Buy/Sell (Binance liefert 5-min-Perioden)
      ratio_period: 5m
    reconnect:
      initial_backoff_s: 1
      max_backoff_s: 60
      stale_timeout_s: 30         # keine Daten -> Verbindung tot
      stable_after_s: 60

aggregation:
  interval_ms: 100        # Breite einer Heatmap-Spalte
  long_interval_ms: 2000  # Langzeit-Heatmap: eine Spalte = Mittel über 2 s ...
  long_bucket_factor: 2   # ... und über je 2 Preis-Buckets (doppelter Preisbereich)
  bucket_bps: 0.06        # Preis-Bucket ~ 0.06 Basispunkte des Preises, je Symbol automatisch
                          # auf runde Tick-Vielfache gerundet (BTC ~80k -> 0.50 USDT)
  half_range_buckets: 400 # Buckets je Seite um den Mid (BTC: 400 x 0.50 = +-200 USDT)

server:
  host: 127.0.0.1         # nur Loopback erlaubt
  port: 8765
  history_columns: 3000   # Historie für neu verbundene Clients (3000 x 100 ms = 5 min)
  long_history_columns: 3600  # Langzeit-Heatmap (3600 x 2 s = 2 h)
  client_queue_frames: 2000

ui:
  recenter_margin: 0.15   # Auto-Recentering, wenn der Mid in die äußeren 15 % läuft
  bubble_px_per_sqrt_kusd: 1.2  # Bubble-Radius = sqrt(Gegenwert/1000 USDT) * Faktor
                                # (100k USDT -> 12 px, 1 Mio. -> 38 px)
  bubble_max_px: 40

history:                  # Tageskerzen (Spot) für ATH, Zyklen, Jahresperformance
  enabled: true
  spot_rest_url: https://data-api.binance.vision   # offizieller Binance-Host nur für Marktdaten
  futures_rest_url: https://fapi.binance.com       # Ersatz ohne Spot-Markt (z. B. Gold/Silber)
  start: "2017-01-01"     # Binance-Spot beginnt im August 2017
  refresh_s: 3600         # Cache in data/history/, danach nur das Ende aktualisieren

recorder:
  data_dir: data     # gitignored
  flush_interval_s: 5
  zstd_level: 9
