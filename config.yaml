# CockBook Konfiguration. Schema: backend/cockbook/config.py
# KEINE Secrets hier eintragen – API-Keys nur über Umgebungsvariablen/Keyring.

logging:
  level: INFO        # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: console    # console | json

exchanges:
  - name: binance_usdm
    enabled: true
    # Reihenfolge = Reihenfolge im Coin-Menü. Top 20 nach Marktkapitalisierung (ohne
    # Stablecoins) + Gold/Silber. Kennzahlen (Preis, 24h, Funding …) gibt es für alle;
    # das Orderbuch (Heatmap) läuft ab Start nur bei always_on, sonst ab der ersten Auswahl.
    # Symbole, die es auf Binance USDⓈ-M nicht gibt, werden mit Warnung übersprungen.
    symbols:
      - {symbol: BTCUSDT, always_on: true}
      - {symbol: ETHUSDT, always_on: true}
      - {symbol: XRPUSDT, always_on: true}
      - symbol: BNBUSDT
      - {symbol: SOLUSDT, always_on: true}
      - symbol: TRXUSDT
      - symbol: DOGEUSDT
      - symbol: ADAUSDT
      - symbol: HYPEUSDT
      - symbol: LINKUSDT
      - symbol: BCHUSDT
      - symbol: XLMUSDT
      - symbol: SUIUSDT
      - symbol: AVAXUSDT
      - symbol: LTCUSDT
      - symbol: HBARUSDT
      - symbol: TONUSDT
      - {symbol: 1000SHIBUSDT, label: "SHIB (x1000)"}   # Futures handeln SHIB nur in 1000er-Einheiten
      - symbol: DOTUSDT
      - symbol: UNIUSDT
      - {symbol: XAUUSDT, label: "Gold (XAU)"}           # TradFi-Perpetual, Handelspausen am Wochenende
      - {symbol: XAGUSDT, label: "Silber (XAG)"}
      # optional fest statt automatisch:  - {symbol: BTCUSDT, bucket_ticks: 5}
    # Endpoints laut Doku (geroutet: /public = Depth, /market = aggTrade/forceOrder)
    rest_url: https://fapi.binance.com
    ws_public_url: wss://fstream.binance.com/public
    ws_market_url: wss://fstream.binance.com/market
    depth_update_ms: 100          # 100 | 250 | 500
    snapshot_limit: 1000          # Gewicht 20 von 2400/min
    max_buffered_updates: 10000
    coverage_refresh_fraction: 0.5  # Refresh, wenn der Mid die innere Hälfte des Snapshots verlässt
    coverage_refresh_min_interval_s: 5  # Refresh wird eingearbeitet, ohne das Buch zu verwerfen
    liquidations_all_market: true   # Liquidationen aller Coins (sekündlich) statt nur der eigenen
    candles_1m_history: 1500        # 1m-Kerzen beim Start (max. 1500 = 25 h)
    candle_reconcile_bars: 3        # jede Minute die letzten 3 abgeschlossenen Kerzen per REST abgleichen
    candle_reconcile_delay_s: 2     # … 2 s nach dem Minutenwechsel (holt nach Pausen automatisch mehr)
    tradfi_stale_timeout_s: 900     # TradFi: in Handelspausen kommen minutenlang keine Updates
    # Alle TradFi-Kontrakte (Aktien, ETFs, Rohstoffe, Devisen) automatisch ins Coin-Menü;
    # Orderbuch startet erst bei Auswahl.
    tradfi_auto_discover: true
    # Kategorie je Symbol (stock | etf | commodity | fx). Binance markiert TradFi-Kontrakte
    # nicht einheitlich, und ETFs sind nicht von Aktien unterscheidbar. Was hier steht, kommt
    # immer ins Menü (sofern auf Binance handelbar); weitere werden automatisch erkannt.
    # Neue Listings einfach ergänzen.
    tradfi_categories:
      # ETFs
      QQQUSDT: etf     # Invesco QQQ (Nasdaq 100)
      SPYUSDT: etf     # SPDR S&P 500
      TQQQUSDT: etf    # ProShares UltraPro QQQ (3x)
      EWJUSDT: etf     # iShares MSCI Japan
      EWYUSDT: etf     # iShares MSCI South Korea
      MSTUUSDT: etf    # T-Rex 2X Long MSTR
      ZCSHUSDT: etf    # Zcash ETF
      GDXUSDT: etf     # VanEck Gold Miners
      IBITUSDT: etf    # iShares Bitcoin Trust
      # Aktien
      AAPLUSDT: stock
      TSMUSDT: stock
      NVDAUSDT: stock
      TSLAUSDT: stock
      AMZNUSDT: stock
      GOOGLUSDT: stock
      METAUSDT: stock
      MSTRUSDT: stock
      COINUSDT: stock
      HOODUSDT: stock
      PLTRUSDT: stock
      INTCUSDT: stock
      CRCLUSDT: stock
      # Rohstoffe
      XAUUSDT: commodity
      XAGUSDT: commodity
      XPTUSDT: commodity
      XPDUSDT: commodity
      CLUSDT: commodity      # WTI-Rohöl
      BZUSDT: commodity      # Brent-Rohöl
      NATGASUSDT: commodity
      COPPERUSDT: commodity
    validation:
      enabled: true
      interval_s: 300             # Abgleich lokales Buch vs. REST-Snapshot alle 5 min
      snapshot_limit: 1000
      history_updates: 600        # ~60 s bei 100 ms
      resync_on_mismatch: true
    metrics:                      # Derivate-Kennzahlen per REST (ohne API-Key)
      enabled: true
      open_interest_interval_s: 15
      ratios_interval_s: 300      # Long/Short + Taker Buy/Sell (Binance liefert 5-min-Perioden)
      ratio_period: 5m
    reconnect:
      initial_backoff_s: 1
      max_backoff_s: 60
      stale_timeout_s: 30         # keine Daten -> Verbindung tot
      stable_after_s: 60

  # Zweite Börse für Multibook (Coin-Menü: Börse umschalten, "Kombiniert" = beide Bücher addiert).
  # Bitunix schickt bei jeder Änderung das ganze Buch (BTC ~500 KB, ~3x/s) – darum Orderbuch nur
  # bei Auswahl; Preise/24h kommen für alle Coins über einen Sammel-Stream.
  - name: bitunix
    enabled: true
    all_symbols: true           # alle handelbaren Bitunix-Paare ins Menü
    symbols: []                 # z. B. [{symbol: BTCUSDT, always_on: true}] = Langzeit-Daten auch für Bitunix
    rest_url: https://fapi.bitunix.com
    ws_url: wss://fapi.bitunix.com/public/
    ping_interval_s: 20         # Bitunix erlaubt max. 5 Nachrichten/s vom Client
    candle_history_bars: 1000   # 1m-Kerzen beim Öffnen eines Coins (REST, je 200)
    candle_reconcile_bars: 3    # jede Minute: laufende Kerze abschließen, letzte 3 durch die offiziellen ersetzen
    candle_reconcile_delay_s: 2
    reconnect:
      initial_backoff_s: 1
      max_backoff_s: 60
      stale_timeout_s: 30
      stable_after_s: 60

aggregation:
  interval_ms: 100        # Breite einer Heatmap-Spalte
  keyframe_every_columns: 50  # alle 5 s vollständige Spalte, dazwischen nur Änderungen
  bucket_bps: 0.06        # Preis-Bucket ~ 0.06 Basispunkte des Preises, je Symbol automatisch
                          # auf runde Tick-Vielfache gerundet (BTC ~80k -> 0.50 USDT)
  half_range_buckets: 8000  # max. Buckets je Seite um den Mid (BTC: 8000 x 0.50 = +-4000 USDT);
                            # gesendet werden nur belegte Buckets
  memory_max_age_s: 3600    # Level außerhalb eines neuen Snapshots nach Neu-Sync so lange
                            # als "zuletzt bekannt" zeigen (REST liefert nur 1000 Level/Seite)
  # Langzeit-Heatmap (eigener Tab): je Stufe eigene Auflösung, auf Platte (data/longterm)
  long_persist: true
  long_half_range_buckets: 3000   # grobe Buckets je Seite um den Mid
  long_tiers:
    #  Zeitraum | eine Spalte | Abtastung | Bucket = n feine | Kerzen
    - {name: "12h", span_h: 12,  interval_s: 30,   sample_s: 2,  factor: 8,   candle_interval: 5m}
    - {name: "1D",  span_h: 24,  interval_s: 60,   sample_s: 3,  factor: 16,  candle_interval: 15m}
    - {name: "1W",  span_h: 168, interval_s: 600,  sample_s: 10, factor: 40,  candle_interval: 1h}
    - {name: "1M",  span_h: 744, interval_s: 1800, sample_s: 30, factor: 100, candle_interval: 4h}

server:
  host: 127.0.0.1         # nur Loopback erlaubt
  port: 8765
  history_columns: 3000   # Historie für neu verbundene Clients (3000 x 100 ms = 5 min)
  client_queue_frames: 2000

agent:                    # Zeichnungen + Zugriff für Claude (MCP-Erweiterung, siehe README)
  tape_trades: 50000      # letzte Trades je Symbol im Speicher (Abfragen "Delta der letzten x min")
  max_drawings_per_symbol: 500
  max_points_per_drawing: 5000
  max_text_len: 4000
  book_range_pct: 1.0     # Orderbuch-Abfrage: Standard-Bereich ± % um den Mid
  book_walls: 10          # so viele größte Level je Seite

ai:                       # KI-Panel (Knopf "KI"): Claude Code / Codex mit deinem Account
  enabled: true
  claude_path: null       # null = automatisch suchen; sonst z. B. C:/Users/NAME/.local/bin/claude.exe
  codex_path: null
  claude_model: null      # null = Standard deines Abos (z. B. sonnet, opus)
  codex_model: null
  allow_paper_orders: false  # true = der Chat darf Paper-Orders setzen (simuliert)
  timeout_s: 300          # längste Antwortzeit
  max_parallel: 2

ui:
  recenter_margin: 0.15   # Auto-Recentering, wenn der Mid in die äußeren 15 % läuft
  bubble_px_per_sqrt_kusd: 1.2  # Bubble-Radius = sqrt(Gegenwert/1000 USDT) * Faktor
                                # (100k USDT -> 12 px, 1 Mio. -> 38 px)
  bubble_max_px: 40
  initial_view_buckets: 250     # Anfangs-Preisbereich je Seite um den Mid

history:                  # Tageskerzen (Spot) für ATH, Zyklen, Jahresperformance
  enabled: true
  spot_rest_url: https://data-api.binance.vision   # offizieller Binance-Host nur für Marktdaten
  futures_rest_url: https://fapi.binance.com       # Ersatz ohne Spot-Markt (z. B. Gold/Silber)
  start: "2017-01-01"     # Binance-Spot beginnt im August 2017
  refresh_s: 3600         # Cache in data/history/, danach nur das Ende aktualisieren

recorder:
  data_dir: data     # gitignored
  flush_interval_s: 5
  zstd_level: 9

trading:
  paper:                        # Paper-Trading: simuliertes Konto gegen die echten Orderbücher
    enabled: true
    start_balance: 10000        # USDT
    default_leverage: 10
    max_leverage: 100
    max_position_usd: 100000000 # größte erlaubte Position (Nominalwert) – praktisch aus
    daily_loss_limit_usd: 0     # z. B. 500: danach keine neuen Positionen bis 00:00 UTC (0 = aus)
    maintenance_margin: 0.005   # für den Liquidationspreis (isolierte Margin)
    fees:                       # Anteil: 0.0005 = 0,05 % – eigene Gebührenstufe eintragen
      binance_usdm: {maker: 0.0002, taker: 0.0005}
      bitunix: {maker: 0.0002, taker: 0.0006}
  live:                         # echtes Bitunix-Konto
    enabled: true               # wirkt nur mit BITUNIX_API_KEY + BITUNIX_API_SECRET in der Umgebung
    rest_url: https://fapi.bitunix.com
    ws_url: wss://fapi.bitunix.com/private/
    refresh_s: 30               # zusätzlicher REST-Abgleich (Sicherheitsnetz zu den Pushes)
    ping_interval_s: 20
    max_leverage: 100
    trading_enabled: false      # true = echte Orders erlaubt (zusätzlich im Browser freischalten)
    max_state_age_s: 90         # neue Positionen nur mit frischem Kontostand
    tpsl_trigger: MARK_PRICE    # oder LAST_PRICE
    min_order_usd: 100          # Bitunix-Mindestwert je Order (gemessen, code 30016)
