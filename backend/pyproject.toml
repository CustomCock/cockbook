[project]
name = "cockbook"
version = "0.0.1"
description = "Orderflow- & Liquidity-Heatmap für Krypto (Backend)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sortedcontainers>=2.4.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "sortedcontainers-stubs>=2.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cockbook"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF", "ASYNC", "PT"]
# Deutsche Texte nutzen Gedankenstriche bewusst.
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true

# CLAUDE.md: strict für core/
[[tool.mypy.overrides]]
module = ["cockbook.core.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen per Polling auf Zustände warten (Fake-Server, Timeouts).
"**/tests/**" = ["ASYNC109", "ASYNC110"]

[tool.ruff.lint.isort]
# explizit, damit Import-Sortierung aus Repo-Root (pre-commit) und backend/ identisch ist
known-first-party = ["cockbook"]
