<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CockBook</title>
  </head>
  <body>
    <header id="bar">
      <span id="symbol">–</span>
      <span id="mode" class="badge">–</span>
      <span id="sync" class="badge off">keine Verbindung</span>
      <label title="Teilt die Obergrenze der Farbskala: mehr Kontrast = mehr Level erreichen die hellste Farbe">
        Kontrast <input id="contrast" type="range" min="-2" max="3" step="0.05" value="0" />
      </label>
      <label title="Perzentil der sichtbaren Liquidität, unter dem nichts gezeichnet wird">
        Schwelle <input id="threshold" type="range" min="0" max="0.9" step="0.01" value="0.1" />
      </label>
      <button id="live" title="Zur Gegenwart springen und Auto-Zentrierung einschalten (Taste C)">Live</button>
      <span id="perf"></span>
    </header>
    <main id="chart">
      <canvas id="gl"></canvas>
      <canvas id="yaxis"></canvas>
      <canvas id="xaxis"></canvas>
      <div id="crossV" class="cross"></div>
      <div id="crossH" class="cross"></div>
      <div id="tooltip"></div>
    </main>
    <footer id="help">
      Mausrad: Preis-Zoom · Shift+Mausrad: Zeit-Zoom · Ziehen: verschieben · Doppelklick / C: Live + Auto-Zentrierung
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
